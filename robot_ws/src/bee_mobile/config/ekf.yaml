ekf_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    use_sim_time: false

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # --- ODOMÉTRIE ROUES (Vitesses locales) ---
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_relative: false

    # --- IMU / GPS HEADING (Rotations locales) ---
    # imu0: /heading_imu
    # imu0_config: [false, false, false,
    #               false, false, false,
    #               false, false, false,
    #               false, false, false,
    #               false, false, false]
    # imu0_relative: false
    
ekf_node_global:
  ros__parameters:
    frequency: 20.0 # <-- RESTAURÉ À 20 Hz
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    use_sim_time: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    # --- 1. POSITION GPS ABSOLUE ---
    odom0: /odometry/gps
    odom0_config: [true,  true,  false, 
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_relative: false

    # --- 2. ODOMÉTRIE ROUES ---
    odom1: /odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,  # <-- CORRECTIF 1 : V_yaw activé
                   false, false, false]
    odom1_relative: false
    
    # --- 3. IMU ABSOLUE (Le Cap boussole) ---
    imu0: /heading_imu
    imu0_config: [false, false, false,
                  false, false, true,   # <-- CORRECTIF 2 : Roll et Pitch désactivés
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_relative: false

navsat_transform_node:
  ros__parameters:
    # --- 1. Repères Spatiaux (TF) ---
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint

    # --- 2. Fonctionnement Général ---
    use_sim_time: false
    frequency: 20.0
    delay: 0.0

    # --- 3. Configuration Spécifique (Double Antenne / RTK) ---
    # Un double GPS donne le Nord Vrai, on n'utilise pas l'odométrie pour deviner le cap
    use_odometry_yaw: false 
    
    # Force l'altitude à 0, très important pour un robot mobile 2D
    zero_altitude: true               

    # --- 4. Paramètres Géographiques ---
    # Déclinaison magnétique à 0 car on est sur le Nord Vrai (Double Antenne)
    magnetic_declination_radians: 0.0 
    
    # yaw_offset : Convertit le "Nord Capteur" en "Est ROS" (0° pointant vers l'Est)
    # Puisque tu as un décalage de 180° combiné à la rotation Nord/Est, 
    # configure l'offset géométrique approprié :
    yaw_offset: 0.0 #3.141592653589793   # Applique un décalage de PI (180 degrés)


    # --- 5. Sorties et Origine ---
    publish_filtered_gps: true
    
    # Publie la transformation (UTM/Local) vers la carte. 
    broadcast_cartesian_transform: false 
    
    # Utilise un repère cartésien local basé sur un point de référence (datum) plutôt que les immenses coordonnées UTM
    use_local_cartesian: true         

    # On attend un datum fixe (origine de la carte) au lieu de prendre le premier signal GPS reçu.
    wait_for_datum: true
    #base_link_offset: [0.64, 0.0, 1.3]  # x, y, z du GPS dans base_link
    datum: [36.3058915, 120.4968436, 0.0] # Labo porte extérieure
    #datum: [36.3068724, 120.4977261, 0.0] # Zone test arbres # TEMP
    #datum: [36.3069306, 120.4974080, 0.0] # Zone test arbres