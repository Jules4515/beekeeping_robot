ekf_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    use_sim_time: false

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # --- WHEEL ODOMETRY (Local velocities) ---
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_relative: false
    
ekf_node_global:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    use_sim_time: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    # --- 1. ABSOLUTE GPS POSITION ---
    odom0: /odometry/gps
    odom0_config: [true,  true,  false, 
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_relative: false

    # --- 2. WHEEL ODOMETRY ---
    odom1: /odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom1_relative: false
    
    # --- 3. ABSOLUTE IMU (Compass heading) ---
    imu0: /heading_imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_relative: false

navsat_transform_node:
  ros__parameters:
    # --- 1. Spatial Frames (TF) ---
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint

    # --- 2. General Operation ---
    use_sim_time: false
    frequency: 20.0
    delay: 0.0

    # --- 3. Specific Configuration (Dual Antenna / RTK) ---
    # Dual GPS provides true north; odometry is not used to estimate heading.
    use_odometry_yaw: false 
    
    zero_altitude: true               

    # --- 4. Geographic Parameters ---
    # Magnetic declination is 0 because true north is provided by dual antennas.
    magnetic_declination_radians: 0.0 
    
    yaw_offset: 0.0


    # --- 5. Outputs and Origin ---
    publish_filtered_gps: true
    
    # Publishes the transformation (UTM/local) to the map.
    broadcast_cartesian_transform: false 
    
    # Uses a local Cartesian frame based on a reference point (datum) instead of large UTM coordinates.
    use_local_cartesian: true         

    # Waits for a fixed datum (map origin) instead of using the first received GPS signal.
    wait_for_datum: true
    #base_link_offset: [0.64, 0.0, 1.3]  # x, y, z of the GPS antenna in base_link
    
    #datum: [36.3058915, 120.4968436, 0.0] # Laboratory exterior door
    datum: [36.3069306, 120.4974080, 0.0] # Tree test area