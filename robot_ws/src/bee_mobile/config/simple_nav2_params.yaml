amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.05
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.1
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    first_map_only: false
    always_transform_velocities: true

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    transform_tolerance: 1.0
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.15
      stateful_timeout: 10.0

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40  # Nombre de pas de temps simulés dans le futur pour évaluer les trajectoires
      model_dt: 0.10  # Pas de temps entre chaque évaluation physique des trajectoires
      batch_size: 200 # Nombre de trajectoires simulées à chaque itération (dt) pour trouver la meilleure trajectoire à suivre
      iteration_count: 1
      motion_model: "Omni"
      vx_max: 0.67
      vx_min: -0.67  
      vy_max: 0.67
      vy_min: -0.67
      wz_max: 0.71
      wz_min: -0.71
      # Écart-types des bruits aléatoires ajoutés à chaque commande de vitesse pour générer les trajectoires simulées,
      # plus les écarts-types sont grands, plus les trajectoires simulées seront différentes les unes des autres,
      # et plus le MPPI pourra trouver une trajectoire de contournement d'obstacle si la trajectoire nominale (sans bruit)
      # est bloquée par un obstacle, mais cela rend aussi le MPPI plus instable et moins précis pour suivre la trajectoire
      # nominale, il faut donc trouver un bon compromis
      vx_std: 0.2
      vy_std: 0.15
      wz_std: 0.3
      ax_max: 0.35
      ax_min: -0.35
      ay_max: 0.35
      ay_min: -0.35
      az_max: 0.5
      az_min: -0.5
      prune_distance: 1.5
      transform_tolerance: 1.0
      # Température : capacité du MPPI à explorer des trajectoires plus coûteuses que la trajectoire nominale (sans bruit),
      # plus la température est élevée, plus le MPPI explorera des trajectoires différentes de la trajectoire nominale, 
      # même si elles sont médiocres ou s'approchent trop des obstacles donc le robot peut être plus lent
      # plus la temprérature est basse, plus le MPPI met de valeur dans la trajectoire nominale qui peut être bloquée par 
      # un obstacle, aussi chattering entre plusieurs autre trajectoires, il n'arrive pas à choisir et n'avance pas
      temperature: 0.4
      gamma: 0.015
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # Liste des critiques utilisés pour évaluer le coût des 200 (batch size) trajectoires simulées tous les 0.1s (dt),
      # et choisir la meilleure trajectoire à suivre (moyenne pondérée), publie la meilleure sur le topic /cmd_vel
      # Plus le cost_weight est grand, plus la pénalité sera grande dans le calcul du coût total de la trajectoire,
      # si la critic n'est pas respectée (eg: obstacle dans la trajectoire pour CostCritic, angle par rapport au goal trop grand pour GoalAngleCritic, etc)
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # Évitement d'obstacles
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 2.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.3
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 15
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 5
        threshold_to_consider: 1.5
      # Alignement par rapport au chemin vers le goal
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 4
        threshold_to_consider: 1.0
        max_angle_to_furthest: 0.25
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      # Fenêtre roulante de 6x6m centrée sur le robot
      # il peut voir les obstacles à 3+ mètres (diagonale > 3m car carré) dans toutes les directions
      # Si le MPPI trouve une trajectoire qui sort de cette fenêtre, son coût sera très élevé
      # donc il faut toujours avoir une fenêtre plus grande que l'horizon de planification du MPPI
      # horizon de planification = time_steps * model_dt * vx_max = 40*0.1*0.67 = 2.68m
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.5
      # Footprint est la bounding exacte du robot, dès que le footprint entre dans l'inflation layer des obstacles, 
      # le coût passe de 0 (zone libre) à une valeur dans [1,253], 
      # cout = inscribed_cost * exp(-cost_scaling_factor * distance entre la cellule évaluée et l'obstacle)
      # inscribed_cost est le coût maximum (253) attribué aux cellules où le robot serait en collision dans CostCritic
      footprint: '[ [0.75, 0.625], [0.75, -0.625], [-0.705, -0.625], [-0.705, 0.625] ]'
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0 # Facteur assez grand pour que le cout diminue rapidement avec la distance, pour que le robot ne soit pas pénalisé dans toute la largeur de l'inflation layer
        inflation_radius: 1.05    # Largeur de l'inflation layer, autour des obstacles
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 24
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 11.5
          obstacle_min_range: 0.30

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: '[ [0.75, 0.625], [0.75, -0.625], [-0.705, -0.625], [-0.705, 0.625] ]' 
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.5
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 11.5
          obstacle_min_range: 0.30
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 1.05

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.71
    min_rotational_vel: 0.35
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [0.67, 0.67, 0.71]
    min_velocity: [-0.67, -0.67, -0.71]
    max_accel: [0.35, 0.35, 0.5]
    max_decel: [-0.35, -0.35, -0.5]
    odom_topic: "odom"
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.1

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    # Ne pas mettre /cmd_vel_smoothed pour cmd_vel_in_topic pour éviter le bouclage entre le velocity smoother et le 
    # collision monitor, qui fait que le robot ne s'arrête pas après le succes du goal nav2, publication en continue 
    # des dernières commandes de vitesse, robot tourne en rond
    cmd_vel_in_topic: "cmd_vel" 
    cmd_vel_out_topic: "cmd_vel_nav"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.0
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: False

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.50
      v_linear_max: 0.80
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.3
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    resolution: 0.05
    max_laser_range: 11.5
    use_maximum_laser_distance: 11.5
    minimum_time_interval: 0.05
    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.05
    coarse_search_angle_offset: 0.15
    scan_buffer_size: 10
    use_scan_matching: true
    use_scan_barycenter: true
    use_response_expansion: true
    coarse_angle_resolution: 0.035
    fine_search_angle_offset: 0.02
    fine_angle_resolution: 0.001
    scan_buffer_maximum_scan_distance: 10.0
    odom_noise_angular: 1.0
    loop_closure: false
    icp_max_iterations: 30
    icp_epsilon: 0.005
    icp_max_correspondence_distance: 0.3
    icp_outlier_distance_threshold: 0.15