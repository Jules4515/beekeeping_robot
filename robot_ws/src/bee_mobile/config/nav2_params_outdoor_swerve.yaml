amcl:
  ros__parameters:
    use_sim_time: False
    
    alpha1: 0.0
    alpha2: 0.0
    alpha3: 0.0
    alpha4: 0.0
    alpha5: 0.0
    
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    
    laser_model_type: "likelihood_field"
    laser_max_range: 0.01
    laser_min_range: 0.0
    max_beams: 0
    
    odom_model_type: "diff"
    
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose: [0.0, 0.0, 0.0]
    
    min_particles: 10
    max_particles: 10
    
    update_min_d: 1000.0
    update_min_a: 6.283
    
    # Disable publication of the map->odom transform.
    tf_broadcast: false  # CRUCIAL: do not publish TF.

lifecycle_manager_localization:
  ros__parameters:
    autostart: true
    node_names: ["map_server"]  # NOT "amcl".

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    transform_tolerance: 1.0
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    publish_zero_velocity: True

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.60     # 50 cm validation radius (outdoor setting).
      yaw_goal_tolerance: 0.25 #pi/6
      #stateful_timeout: 10.0

    FollowPath:
      # # 1. Replace the direct MPPI plugin with the Shim Controller.
      # plugin: "nav2_rotation_shim_controller::RotationShimController"
      
      # # 2. Declare MPPI as the child controller.
      # primary_controller: "nav2_mppi_controller::MPPIController"
      
      # # --- Shim Controller parameters (alignment) ---
      # angular_dist_threshold: 0.523  # Alignment tolerance in radians (about 30 degrees); below this, MPPI starts directly.
      # forward_sampling_distance: 0.5 # Distance along the path at which the plugin calculates the target tangent.
      # rotate_to_heading_angular_vel: 0.5 # Angular velocity (wz) sent to PIVOT mode during alignment.
      # max_angular_accel: 1.0         # Angular acceleration during alignment.
      # simulate_ahead_time: 1.0       # Simulation time for collision prediction during rotation.

      plugin: "nav2_mppi_controller::MPPIController"
      # --- MPPI parameters ---
      time_steps: 40  # Number of simulated future time steps used to evaluate trajectories.
      model_dt: 0.10  # Time step between each physical trajectory evaluation.
      batch_size: 200 # Number of trajectories simulated at each iteration (dt) to find the best trajectory.
      iteration_count: 1
      motion_model: "Omni"
      vx_max: 0.80
      vx_min: -0.80
      vy_max: 0.80
      vy_min: -0.80
      wz_max: 0.91
      wz_min: -0.91
      # Standard deviations of random noise added to each velocity command to generate simulated trajectories.
      # Larger standard deviations produce more diverse simulated trajectories,
      # helping MPPI find an obstacle-avoidance trajectory if the nominal trajectory (without noise)
      # is blocked by an obstacle. However, this also makes MPPI less stable and less precise when following
      # the nominal trajectory, so a good compromise is required.
      vx_std: 0.2
      vy_std: 0.15
      wz_std: 0.3
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.0
      az_min: -3.0
      prune_distance: 1.5
      transform_tolerance: 1.0
      # Temperature: MPPI's ability to explore trajectories that are more costly than the nominal trajectory (without noise).
      # A higher temperature makes MPPI explore trajectories farther from the nominal trajectory,
      # even if they are poor or too close to obstacles, which can make the robot slower.
      # A lower temperature gives more weight to the nominal trajectory, which may be blocked by an obstacle,
      # and can also cause chattering between trajectories when MPPI cannot choose and does not move.
      temperature: 0.4
      gamma: 0.015
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # List of critics used to evaluate the cost of the 200 (batch size) trajectories simulated every 0.1 s (dt),
      # select the best trajectory to follow (weighted average), and publish it on /cmd_vel.
      # The larger the cost_weight, the greater the penalty in the total trajectory cost
      # when a critic is not satisfied (e.g. an obstacle for CostCritic or excessive goal angle for GoalAngleCritic).
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # Obstacle avoidance.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.5 #2.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.3
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 15
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 5
        threshold_to_consider: 1.5
      # Alignment with the path to the goal.
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 4
        threshold_to_consider: 1.0
        max_angle_to_furthest: 0.25
        mode: 0

# LIDAR ENABLED
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.1
      transform_tolerance: 0.5
      footprint: '[ [0.75, 0.625], [0.75, -0.625], [-0.705, -0.625], [-0.705, 0.625] ]'
      
      # 1. Update the plugin list.
      plugins: ["obstacle_layer", "inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 1.05
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          # 1. CLEARING ENGINE: validates rays pointing toward free space.
          inf_is_valid: True 
          
          # 2. RAYTRACE > OBSTACLE_MAX_RANGE: the clearing ray must extend beyond the marking area.
          raytrace_max_range: 12.0 
          obstacle_max_range: 8.0
          
          obstacle_min_range: 1.05
          max_obstacle_height: 2.0
          clearing: True
          marking: True
      
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: '[ [0.75, 0.625], [0.75, -0.625], [-0.705, -0.625], [-0.705, 0.625] ]' 
      track_unknown_space: false
      transform_tolerance: 0.5
      rolling_window: true
      width: 200
      height: 200
      resolution: 0.2
      #plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      #plugins: ["inflation_layer"] # GPS navigation
      plugins: ["obstacle_layer", "inflation_layer"] # Reactivate the obstacle layer.
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: True  
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True   # Allow LiDAR to clear obstacles that have disappeared.
          marking: True    # Allow LiDAR to mark new obstacles.
          raytrace_max_range: 10.0 # Maximum distance for clearing free space.
          obstacle_max_range: 8.0  # Maximum distance for marking an obstacle.
          
          # --- SELF-COLLISION FILTER ---
          # Ignore laser points reflected by the physical robot structure.
          # Computed from the large robot footprint (radius of about 1.05 m).
          obstacle_min_range: 1.05
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 1.0

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.71
    min_rotational_vel: 0.35
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [0.80, 0.80, 0.91]
    min_velocity: [-0.80, -0.80, -0.91]
    max_accel: [3.0, 3.0, 3.0]
    max_decel: [-3.0, -3.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.1

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    # Do not use /cmd_vel_smoothed for cmd_vel_in_topic to avoid a loop between the velocity smoother and
    # the collision monitor. Otherwise, the robot does not stop after a successful Nav2 goal, keeps publishing
    # the last velocity commands, and drives in circles.
    cmd_vel_in_topic: "cmd_vel" 
    cmd_vel_out_topic: "cmd_vel_nav"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.0
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: False

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.60
      v_linear_max: 0.80
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.3
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    resolution: 0.05
    max_laser_range: 11.5
    use_maximum_laser_distance: 11.5
    minimum_time_interval: 0.05
    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.05
    coarse_search_angle_offset: 0.15
    scan_buffer_size: 10
    use_scan_matching: true
    use_scan_barycenter: true
    use_response_expansion: true
    coarse_angle_resolution: 0.035
    fine_search_angle_offset: 0.02
    fine_angle_resolution: 0.001
    scan_buffer_maximum_scan_distance: 10.0
    odom_noise_angular: 1.0
    loop_closure: false
    icp_max_iterations: 30
    icp_epsilon: 0.005
    icp_max_correspondence_distance: 0.3
    icp_outlier_distance_threshold: 0.15