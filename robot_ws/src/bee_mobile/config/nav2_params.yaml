# =============================================================================
#  Nav2 parameters — bee_mobile (4WS robot)
#  Localization : slam_toolbox (publishes map -> odom TF)
#  Controller   : MPPI Omni (holonomic: crab + zero turn)
#  Robot speeds : physical minimum 0.5 m/s, usable maximum 1.5 m/s
#
#  HARDWARE CONSTRAINT:
#    Motors have a physical minimum speed of ~0.5 m/s below which they stall.
#    Nav2 may command lower speeds near the goal — those are clamped up to
#    0.5 m/s inside four_ws_controller_auto.py (MIN_SPEED_CLAMP logic).
#    Nav2 commanding 0.0 (intentional stop) is always respected.
#
#  NOTE ON AMCL:
#    The amcl section is kept for reference but is NOT launched when using
#    slam_toolbox. slam_toolbox already publishes the map -> odom transform.
#    If you switch to a pre-built map + localization-only mode, you can
#    use amcl instead of slam_toolbox.
# =============================================================================

# -----------------------------------------------------------------------------
#  AMCL — Adaptive Monte Carlo Localization
#  Not used when slam_toolbox is active. Kept for reference.
# -----------------------------------------------------------------------------
amcl:
  ros__parameters:
    # Odometry noise model coefficients (rotation and translation errors)
    alpha1: 0.2                         # rotation noise from rotation
    alpha2: 0.2                         # rotation noise from translation
    alpha3: 0.2                         # translation noise from translation
    alpha4: 0.2                         # translation noise from rotation
    alpha5: 0.2                         # strafe noise (omnidirectional model only)
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5             # max distance to consider a beam as skipped
    beam_skip_error_threshold: 0.9      # fraction of beams that must be valid
    beam_skip_threshold: 0.3            # fraction of beams to skip
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1                   # decay rate for short readings
    laser_likelihood_max_dist: 2.0      # max distance for likelihood field model
    laser_max_range: 12.0               # RPLIDAR C1 max range (m)
    laser_min_range: 0.05               # RPLIDAR C1 min range (m)
    laser_model_type: "likelihood_field"
    max_beams: 60                       # number of laser beams used per update
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05                        # target error in filter distribution
    pf_z: 0.99                          # probability that actual error < pf_err
    recovery_alpha_fast: 0.0            # fast exponential decay for recovery
    recovery_alpha_slow: 0.0            # slow exponential decay for recovery
    resample_interval: 1                # resample every N filter updates
    # NOTE: OmniMotionModel would be more accurate for a 4WS robot,
    # but since amcl is not used with slam_toolbox it doesn't matter here.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5                 # rate at which to save last estimated pose (Hz)
    sigma_hit: 0.2                      # std dev of Gaussian model for hit beams
    tf_broadcast: true                  # broadcast map -> odom TF (disable if slam_toolbox active)
    transform_tolerance: 0.1            # INCREASED from 0.5: tighter tolerance for faster transforms
    update_min_a: 0.2                   # min angular movement before filter update (rad)
    update_min_d: 0.25                  # min linear movement before filter update (m)
    z_hit: 0.5                          # mixture weight for hit model
    z_max: 0.05                         # mixture weight for max range model
    z_rand: 0.5                         # mixture weight for random model
    z_short: 0.05                       # mixture weight for short reading model
    scan_topic: scan
    # ADDED: Initialization parameters to ensure map->odom TF is published immediately
    first_map_only: false               # CRITICAL: must initialize from first scan
    always_transform_velocities: true   # immediately publish transform on init

# -----------------------------------------------------------------------------
#  BT Navigator — Behavior Tree navigation coordinator
# -----------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10                # BT loop period (ms)
    transform_tolerance: 1.0            # Increased to 1.0s: tolerate TF_OLD_DATA issues
    default_server_timeout: 20          # timeout waiting for action servers (s)
    wait_for_service_timeout: 1000      # timeout waiting for services (ms)
    action_server_result_timeout: 900.0 # timeout for action result (s)
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    #   nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    #   nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# -----------------------------------------------------------------------------
#  Controller Server — runs the local controller (MPPI) at each control cycle
# -----------------------------------------------------------------------------
controller_server:
  ros__parameters:
    controller_frequency: 10.0          # control loop rate (Hz) — reduced from 20 Hz (hardware bottleneck)
    costmap_update_timeout: 1.0        # max time to wait for costmap update (s)
    min_x_velocity_threshold: 0.001     # velocities below this are treated as zero
    # FIXED (min_y_velocity_threshold was 0.5): threshold of 0.5 = max speed, Nav2 was ignoring all lateral velocity
    min_y_velocity_threshold: 0.001     # critical for Omni model: enables lateral (crab) commands
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5          # tolerated controller failure duration before aborting (s)
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # -- Progress checker ---------------------------------------------------
    # Verifies the robot is making progress toward the goal.
    # With 0.23 m/s minimum speed, final approach is slow — increased timeouts.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15   # must move 15 cm (was 0.30) — lower threshold near goal
      movement_time_allowance: 20.0    # within 20 seconds (was 12) — allow slow final approach

    # -- Goal checker -------------------------------------------------------
    # Tolerances for declaring the goal reached.
    # NOTE: With 0.23 m/s minimum speed, stopping precisely is hardware-limited.
    # Fine docking will be handled by a dedicated ArUco controller, not Nav2.
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 0.15
      stateful_timeout: 10.0            # max time to maintain stopped state (s)

    # -- MPPI Controller ----------------------------------------------------
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # Prediction horizon: time_steps * model_dt = total simulated time
      time_steps: 45                    # number of prediction steps (reduced from 50 for performance)
      model_dt: 0.10                    # time per step (s)
      batch_size: 200                   # sampled trajectories per iteration (reduced from 500 — compute bottleneck)
      iteration_count: 1                # MPPI optimization iterations per cycle

      # -- Motion model -----------------------------------------------------
      # FIXED (was "DiffDrive"): Omni allows Nav2 to generate vx, vy AND wz
      # -> your controller maps these to Crab or ZeroTurn modes
      motion_model: "Omni"

      # -- Velocity limits --------------------------------------------------
      # Physical minimum speed (0.23 m/s) must be respected.
      # MPPI must be able to command 0.0 to stop at the goal.
      vx_max:  0.67
      vx_min:  0.0                    # Autorise la marche arrière (Claude avait mis 0.00)
      vy_max:  0.67                    
      vy_min:  0.0                    # AJOUT OBLIGATOIRE : Autorise le crabe à droite
      wz_max:  0.71                    
      wz_min: -0.71                   # AJOUT OBLIGATOIRE : Autorise la rotation à droite

      # -- Sampling noise ---------------------------------------------------
      # On divise le bruit pour forcer la continuité spatiale (le CIR ne peut plus sauter)
      vx_std:  0.10                     # (Anciennement 0.20)
      vy_std:  0.03                     # (Anciennement 0.20) TRÈS IMPORTANT: Tue les sauts latéraux secs.
      wz_std:  0.05                     # (Anciennement 0.15) Force une évolution très lente de la rotation.

      # -- Acceleration limits ----------------------------------------------
      # Maintien de l'accélération longitudinale, effondrement des accélérations latérales/angulaires.
      ax_max:  0.5                      
      ax_min: -0.5                      
      ay_max:  0.10                     # (Anciennement 0.5) Le robot devra amorcer son mode crabe très doucement.
      ay_min: -0.10
      az_max:  0.15                     # (Anciennement 0.5) Le robot devra tourner avec la souplesse d'un volant.
      az_min: -0.15

      # -- MPPI algorithm ---------------------------------------------------
      prune_distance: 1.5               # prune path behind robot (m) (was 1.7)
      transform_tolerance: 1.0          # TF tolerance (s) — increased to handle TF_OLD_DATA warnings
      temperature: 0.05                 # (Anciennement 0.15) Verrouille le choix de la trajectoire pour éviter les vibrations.      gamma: 0.015                      # discount factor for cost weighting
      visualize: true                   # publish candidate trajectories to RViz2
      regenerate_noises: true           # regenerate noise samples each iteration

      TrajectoryVisualizer:
        trajectory_step: 5              # visualize every Nth trajectory
        time_step: 3                    # visualize every Nth time step

      # AckermannConstraints removed — not relevant for Omni holonomic model

      # ── Critics — holonomic rough navigation (±50 cm) ─────────────────
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]

      # Prevents physically impossible maneuvers based on your velocity/acceleration limits.
      ConstraintCritic:
        enabled: true
        cost_power: 1                  # Exponent applied to the cost (1 = linear scaling).
        cost_weight: 4.0               # Multiplier for the final penalty score.

      # Ensures obstacle avoidance by penalizing trajectories entering inflated costmap zones.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81               # Balance between following the path and avoiding walls.
        near_collision_cost: 253       # Cost added when entering the inflation radius.
        critical_cost: 300.0           # Cost threshold to completely reject a trajectory.
        consider_footprint: true       # Uses the actual robot shape instead of a single center point.
        collision_cost: 1000000.0      # Infinite penalty for hitting a lethal obstacle.
        near_goal_distance: 1.0        # Distance in meters where obstacle avoidance relaxes slightly to allow docking.
        trajectory_point_step: 2       # Checks for collisions every 2 trajectory points to save CPU.

      # Attracts the robot to the exact final X,Y coordinates.
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0              # Massive weight to guarantee precise X,Y arrival.
        threshold_to_consider: 2.0     # Distance in meters from the goal where this critic activates.

      # Aligns the final robot rotation (Yaw). Kept asleep until the very end for pure Zero Turn.
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0              # Strong weight to force rotation, but restricted by the threshold below.
        threshold_to_consider: 0.3     # Activates ONLY in the last 30cm to force in-place rotation.

      # Keeps the generated trajectories geometrically close to the global path.
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0               # Moderate weight to allow slight deviations for obstacle avoidance.
        max_path_occupancy_ratio: 0.05 # Max fraction of trajectory allowed outside the path bounds.
        trajectory_point_step: 3       # Evaluates every 3 points to save CPU.
        threshold_to_consider: 0.5     # Deactivates near the goal to let GoalCritic take over.
        offset_from_furthest: 15       # Lookahead distance in path points to align with.
        use_path_orientations: false   # Evaluates position only, ignoring the path's requested heading.

      # Pushes the robot forward along the path to ensure the shortest and fastest route.
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0               # High weight to maintain constant forward progress.
        offset_from_furthest: 5        # Lookahead points to pull the robot toward.
        threshold_to_consider: 1.5     # Deactivates near the goal.

      # Forces the front of the robot (its nose) to point in the direction it is moving.
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 15.0              # High weight ensures immediate initial re-orientation.
        offset_from_furthest: 4        # Lookahead points for calculating the required angle.
        threshold_to_consider: 1.0     # Deactivates near the goal.
        max_angle_to_furthest: 0.25     # Maximum allowed angular deviation in radians.
        mode: 0                        # 0 = Forward driving direction.

      # Penalizes lateral (Y-axis) velocities to heavily discourage crab-walking.
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 20.0              # Extreme weight to force Ackermann-like straight driving.
        threshold_to_consider: 0.5     # Deactivates near the goal to allow final adjustments.

      # TwirlingCritic: penalizes spinning in place, disabled by default
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

# -----------------------------------------------------------------------------
#  Local Costmap — rolling window around the robot, used by MPPI
# -----------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0             # costmap update rate (Hz)
      publish_frequency: 2.0            # publish rate for visualization (Hz)
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true              # window moves with the robot
      width: 6                         # window width (m) — increased (was 3) for faster robot
      height: 6                         # window height (m)
      resolution: 0.05                  # grid cell size (m)
      transform_tolerance: 0.5
      # Robot footprint polygon (asymmetric: arm extends behind center)
      # Points: [front-left, front-right, rear-right, rear-left] in base_footprint frame
      footprint: '[ [0.8, 0.7], [0.8, -0.7], [-0.8, -0.7], [-0.8, 0.7] ]'
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0       # cost decay rate with distance from obstacle
        inflation_radius: 1.10
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05              # voxel height (m)
        z_voxels: 24                    # number of vertical voxels
        max_obstacle_height: 2.0        # max height considered as obstacle (m)
        mark_threshold: 0               # min voxels to mark cell as occupied
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True                # use scan to clear free space
          marking: True                 # use scan to mark obstacles
          data_type: "LaserScan"
          raytrace_max_range: 12.0       # max range to clear free space (m) (was 3.0)
          raytrace_min_range: 0.0
          obstacle_max_range: 11.5       # max range to mark obstacles (m) (was 2.5)
          obstacle_min_range: 0.05
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

# -----------------------------------------------------------------------------
#  Global Costmap — full map used by the global planner
# -----------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0             # update rate (Hz) — slower than local is fine
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: '[ [0.8, 0.7], [0.8, -0.7], [-0.8, -0.7], [-0.8, 0.7] ]'
      #footprint: '[ [0.6, 0.6], [0.6, -0.6], [-0.6, -0.6], [-0.6, 0.6] ]'   #longueur = 160cm, largeur = 140cm
      resolution: 0.05
      track_unknown_space: true         # treat unknown cells as potentially traversable
      transform_tolerance: 0.5          # INCREASED: wait up to 300ms for map->odom transform
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0       # was 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 11.5       # was 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 1.10
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

# -----------------------------------------------------------------------------
#  Map Saver
# -----------------------------------------------------------------------------
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25           # probability below which a cell is free
    occupied_thresh_default: 0.65       # probability above which a cell is occupied
    map_subscribe_transient_local: True

# -----------------------------------------------------------------------------
#  Planner Server — computes the global path from start to goal
# -----------------------------------------------------------------------------
planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0    # expected replanning rate (Hz)
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5                    # goal tolerance for path planning (m)
      # CHANGED (was false): A* is more reliable than Dijkstra in constrained spaces
      use_astar: true
      allow_unknown: true               # allow planning through unknown cells

# -----------------------------------------------------------------------------
#  Smoother Server — smooths the global path for the local controller
# -----------------------------------------------------------------------------
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10                # convergence tolerance
      max_its: 1000                     # max smoothing iterations
      do_refinement: True               # refine path after smoothing

# -----------------------------------------------------------------------------
#  Behavior Server — recovery behaviors (spin, backup, wait)
# -----------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0               # behavior execution rate (Hz)
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0            # time horizon for collision check (s)
    # FIXED: min_rotational_vel must be >= wz at which wheel speed = physical minimum
    # wz_min = v_min / r_pivot = 0.5 / sqrt((0.96/2)^2 + (0.83/2)^2) = 0.5/0.635 ~ 0.79
    # Set to 0.85 to have a small margin above the stall threshold.
    max_rotational_vel: 0.71           # was 1.0 — robot can turn at up to 2.0 rad/s
    min_rotational_vel: 0.35            # was 0.4 — CRITICAL: below 0.79 wheels stall
    rotational_acc_lim: 3.2             # angular acceleration limit (rad/s²)

# -----------------------------------------------------------------------------
#  Waypoint Follower — executes a sequence of waypoints
# -----------------------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    loop_rate: 20                       # execution rate (Hz)
    stop_on_failure: false              # continue to next waypoint on failure
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200      # pause at each waypoint (ms)

# -----------------------------------------------------------------------------
#  Route Server — graph-based navigation (optional, for apiary row following)
# -----------------------------------------------------------------------------
route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0  # outer radius to consider node reached (m)
    radius_to_achieve_node: 2.0           # inner radius to consider node reached (m)
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

# -----------------------------------------------------------------------------
#  Velocity Smoother — smooths cmd_vel before sending to the robot
# -----------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "CLOSED_LOOP"               # no velocity feedback from odometry
    # FIXED: [x, y, theta] — y was 0.0, blocking all lateral (crab) commands
    max_velocity:    [0.67, 0.67, 0.71] 
    min_velocity:    [-0.67, -0.67, -0.71]
    # L'accélération [vx, vy, wz] est asymétrique pour garantir la fluidité directionnelle
    max_accel:       [0.5, 0.10, 0.15]   
    # Le freinage d'urgence autorise un arrêt net pour protéger la mécanique
    max_decel:       [-1.5, -0.30, -0.45]
    odom_topic: "odom"
    odom_duration: 0.2                  # duration of odom history used for smoothing (s)
    deadband_velocity: [0.02, 0.02, 0.02] # velocities below this are zeroed out
    velocity_timeout: 0.1              # timeout before publishing zero velocity (s)

# -----------------------------------------------------------------------------
#  Collision Monitor — last-resort safety stop before cmd_vel reaches robot
# -----------------------------------------------------------------------------
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"     # receives smoothed vel from velocity_smoother
    cmd_vel_out_topic: "cmd_vel_nav"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 1.0                 # max age of observation before considered stale (s)
    base_shift_correction: True
    stop_pub_timeout: 2.0               # publish zero vel for this long after stop (s)
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"           # slow down / stop when obstacle in footprint
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2        # stop if collision predicted within 1.2 s
      simulation_time_step: 0.1
      min_points: 6                     # min obstacle points to trigger
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15                  # ignore ground reflections below 15 cm
      max_height: 2.0
      enabled: False # True

# -----------------------------------------------------------------------------
#  Docking Server — precision approach and docking sequence
#  Used for beehive docking with ArUco markers
# -----------------------------------------------------------------------------
docking_server:
  ros__parameters:
    controller_frequency: 50.0          # docking control loop rate (Hz)
    initial_perception_timeout: 5.0     # timeout to detect dock marker (s)
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0         # max time for full docking sequence (s)
    undock_linear_tolerance: 0.05       # linear tolerance to consider undocked (m)
    undock_angular_tolerance: 0.1       # angular tolerance to consider undocked (rad)
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5      # tolerance for pre-staging position (m)
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05           # distance to consider docked (m)
      staging_x_offset: -0.7           # pre-staging offset from dock (m)
      use_external_detection_pose: true # use ArUco pose as dock target
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1                  # low-pass filter on detected pose
    # Dock instances — uncomment and configure for each beehive:
    # docks: ['hive_1', 'hive_2']
    # hive_1:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [x, y, yaw]
    controller:
      k_phi: 3.0                        # heading error gain
      k_delta: 2.0                      # bearing error gain
      # FIXED: v_linear_min/max were both 0.15, below physical motor minimum (0.5 m/s)
      v_linear_min: 0.50                # was 0.15 — must be >= physical minimum
      v_linear_max: 0.80                # was 0.15 — increased for usable docking speed
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.3
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

# -----------------------------------------------------------------------------
#  Loopback Simulator — lightweight Nav2 simulator (no Gazebo required)
#  Simulates odometry response to cmd_vel and generates a fake lidar scan.
#  All scan rays are set to infinity (scan_use_inf: true) — no obstacles.
#  Useful for testing Nav2 trajectory generation and controller behavior.
#  NOTE: SLAM cannot build a real map with infinite rays. Use for Nav2 tuning only.
# -----------------------------------------------------------------------------
loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    # FIXED: was "base_scan" (TurtleBot4 default) — must match your actual laser_frame name
    scan_frame_id: "laser_frame"
    update_duration: 0.02               # simulation step (s) — matches odometry at 50 Hz
    scan_range_min: 0.05                # RPLIDAR C1 min range (m)
    scan_range_max: 12.0                # RPLIDAR C1 max range (m)
    scan_angle_min: -3.1415             # full 360° scan
    scan_angle_max:  3.1415
    scan_angle_increment: 0.02617       # ~1.5° per beam (matches RPLIDAR C1 at 0.72°/beam approx)
    scan_use_inf: true                  # all beams return infinity (empty environment)

slam_toolbox:
  ros__parameters:
    # --- General parameters ---
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    
    # --- Map resolution and laser range ---
    resolution: 0.05
    max_laser_range: 11.5
    use_maximum_laser_distance: 11.5
    
    # --- TRIGGER TIMING (Calculated for max rotational velocity) ---
    # Allow updates up to 20Hz to keep up with fast physical rotation
    minimum_time_interval: 0.05
    
    minimum_travel_distance: 0.02  # ↓ De 0.05 à 0.02 (corrige après 2cm de mouvement)
    minimum_travel_heading: 0.05   # ↓ De 0.15 à 0.05 (corrige après 3° de rotation) 
    
    coarse_search_angle_offset: 0.15  # was 0.35
    scan_buffer_size: 10              # was 30

    # --- SCAN MATCHER ALGORITHM ---
    use_scan_matching: true
    use_scan_barycenter: true
    use_response_expansion: true

    # Coarse search: Keep at ~20 deg. If set too high, symmetric 
    # environments (hallways) might cause instant 90-degree map tears.
    coarse_angle_resolution: 0.035      
    
    # Fine search: Mathematically widened to 0.02 rad (> 1.1 degrees)
    # This guarantees the window is larger than the 8.33% odometry error 
    # accumulated over the 4.5 degree trigger threshold.
    fine_search_angle_offset: 0.02     
    fine_angle_resolution: 0.001
    
    # --- DATA BUFFER ---
    # Buffer more scans to maintain feature geometry during rapid spins
    scan_buffer_maximum_scan_distance: 10.0

    odom_noise_angular: 1.0
    loop_closure: false

    # Paramètres ICP (pour mieux gérer les couloirs)
    icp_max_iterations: 30          # ↑ De 20 à 30 (meilleure convergence)
    icp_epsilon: 0.005              # ↓ De 0.01 à 0.005 (plus précis)
    icp_max_correspondence_distance: 0.3  # ↓ De 0.5 à 0.3 (évite les fausses correspondances)
    icp_outlier_distance_threshold: 0.15 # ↓ De 0.2 à 0.15 (rejette les points trop éloignés)