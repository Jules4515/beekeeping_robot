amcl:
  ros__parameters:
    use_sim_time: False
    
    # Désactiver TOUTES les corrections
    alpha1: 0.0  # Plus de bruit = plus de confiance dans l'odométrie
    alpha2: 0.0
    alpha3: 0.0
    alpha4: 0.0
    alpha5: 0.0
    
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    
    # Désactiver complètement le laser
    laser_model_type: "likelihood_field"
    laser_max_range: 0.01  # Portée quasi-nulle
    laser_min_range: 0.0
    max_beams: 0  # AUCUN beam = AUCUNE correction lidar
    
    # Forcer le modèle d'odométrie pure
    odom_model_type: "diff"
    
    # Initialisation critique
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose: [0.0, 0.0, 0.0]  # Position initiale fixe
    
    # Filtre à particules minimal
    min_particles: 10
    max_particles: 10  # Très peu de particules
    
    # Mise à jour très lente
    update_min_d: 1000.0  # Ne pas mettre à jour avant 1000m
    update_min_a: 6.283  # Ne pas mettre à jour avant 360°
    
    # Désactiver la publication de la transformation map->odom
    tf_broadcast: false  # ← CRUCIAL : ne pas publier de TF

lifecycle_manager_localization:
  ros__parameters:
    autostart: true
    node_names: ["map_server"]  # ← PAS "amcl" !

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    transform_tolerance: 1.0
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    publish_zero_velocity: True

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.50     # Rayon de validation de 50 cm (adapté à l'extérieur)
      yaw_goal_tolerance: 3.14159 # Tolérance de Pi radians (180°). Le robot valide le point peu importe où il regarde.
      #stateful_timeout: 10.0

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40  # Nombre de pas de temps simulés dans le futur pour évaluer les trajectoires
      model_dt: 0.10  # Pas de temps entre chaque évaluation physique des trajectoires
      batch_size: 200 # Nombre de trajectoires simulées à chaque itération (dt) pour trouver la meilleure trajectoire à suivre
      iteration_count: 1
      motion_model: "Omni"
      vx_max: 0.50
      vx_min: -0.50
      vy_max: 0.50
      vy_min: -0.50
      wz_max: 0.71
      wz_min: -0.71
      # Écart-types des bruits aléatoires ajoutés à chaque commande de vitesse pour générer les trajectoires simulées,
      # plus les écarts-types sont grands, plus les trajectoires simulées seront différentes les unes des autres,
      # et plus le MPPI pourra trouver une trajectoire de contournement d'obstacle si la trajectoire nominale (sans bruit)
      # est bloquée par un obstacle, mais cela rend aussi le MPPI plus instable et moins précis pour suivre la trajectoire
      # nominale, il faut donc trouver un bon compromis
      vx_std: 0.2
      vy_std: 0.15
      wz_std: 0.3
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.0
      az_min: -3.0
      prune_distance: 1.5
      transform_tolerance: 1.0
      # Température : capacité du MPPI à explorer des trajectoires plus coûteuses que la trajectoire nominale (sans bruit),
      # plus la température est élevée, plus le MPPI explorera des trajectoires différentes de la trajectoire nominale, 
      # même si elles sont médiocres ou s'approchent trop des obstacles donc le robot peut être plus lent
      # plus la temprérature est basse, plus le MPPI met de valeur dans la trajectoire nominale qui peut être bloquée par 
      # un obstacle, aussi chattering entre plusieurs autre trajectoires, il n'arrive pas à choisir et n'avance pas
      temperature: 0.4
      gamma: 0.015
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # Liste des critiques utilisés pour évaluer le coût des 200 (batch size) trajectoires simulées tous les 0.1s (dt),
      # et choisir la meilleure trajectoire à suivre (moyenne pondérée), publie la meilleure sur le topic /cmd_vel
      # Plus le cost_weight est grand, plus la pénalité sera grande dans le calcul du coût total de la trajectoire,
      # si la critic n'est pas respectée (eg: obstacle dans la trajectoire pour CostCritic, angle par rapport au goal trop grand pour GoalAngleCritic, etc)
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # Évitement d'obstacles
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 2.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.3
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 15
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 5
        threshold_to_consider: 1.5
      # Alignement par rapport au chemin vers le goal
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 4
        threshold_to_consider: 1.0
        max_angle_to_furthest: 0.25
        mode: 0

# LIDAR ACTIVÉ
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.1
      transform_tolerance: 0.5
      footprint: '[ [0.75, 0.625], [0.75, -0.625], [-0.705, -0.625], [-0.705, 0.625] ]'
      
      # 1. Mise à jour de la liste des plugins
      plugins: ["obstacle_layer", "inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 1.05
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True   # Autorise le LiDAR à effacer les obstacles qui ont disparu
          marking: True    # Autorise le LiDAR à dessiner de nouveaux obstacles
          raytrace_max_range: 10.0 # Distance max pour "nettoyer" l'espace libre
          obstacle_max_range: 8.0  # Distance max pour imprimer un obstacle
          
          # --- LE FILTRE D'AUTO-COLLISION ---
          # Ignore tout point laser rebondissant sur la structure physique du robot.
          # Calculé selon ton footprint massif (rayon de ~1.05m)
          obstacle_min_range: 1.05

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: '[ [0.75, 0.625], [0.75, -0.625], [-0.705, -0.625], [-0.705, 0.625] ]' 
      track_unknown_space: false
      transform_tolerance: 0.5
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.2
      #plugins: ["static_layer", "obstacle_layer", "inflation_layer"] 
      #plugins: ["inflation_layer"] #nav GPS
      plugins: ["obstacle_layer", "inflation_layer"] # Réactivation de la couche obstacle
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: True  
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True   # Autorise le LiDAR à effacer les obstacles qui ont disparu
          marking: True    # Autorise le LiDAR à dessiner de nouveaux obstacles
          raytrace_max_range: 10.0 # Distance max pour "nettoyer" l'espace libre
          obstacle_max_range: 8.0  # Distance max pour imprimer un obstacle
          
          # --- LE FILTRE D'AUTO-COLLISION ---
          # Ignore tout point laser rebondissant sur la structure physique du robot.
          # Calculé selon ton footprint massif (rayon de ~1.05m)
          obstacle_min_range: 1.05
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 1.0

